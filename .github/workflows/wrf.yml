name: WRF SMN

on:
  schedule:
    # Las corridas de 00, 06, 12 y 18 UTC se publican unas 2 h 45 min después.
    - cron: "50 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:

concurrency:
  group: wrf-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: workers/wrf/requirements.txt
      - run: uv run --with-requirements workers/wrf/requirements.txt python workers/wrf/ingest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
